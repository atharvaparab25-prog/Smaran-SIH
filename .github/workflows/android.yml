name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java 17 for Project
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Gradle Wrapper Execution
      uses: gradle/actions/setup-gradle@v4

    - name: Fix Wrapper Executable Permissions
      run: chmod +x gradlew || true

    - name: Bypass Code Signing for Prototype
      run: |
        sed -i '/signingConfig = signingConfigs.getByName("release")/d' app/build.gradle.kts || true
        sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts || true

    - name: Build Debug APK Binary
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Binary
      uses: actions/upload-artifact@v4
      with:
        name: smaran-sih-apk
        path: app/build/outputs/apk/debug/app-debug.apk
