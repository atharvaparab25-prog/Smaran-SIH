name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java 21 for Modern Gradle Engine
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Matching Cloud Gradle Engine
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Bypass Code Signing for Prototype Validation
      run: |
        sed -i '/signingConfig = signingConfigs.getByName("release")/d' app/build.gradle.kts || true
        sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts || true

    - name: Build Debug APK via Cloud Compiler
      run: gradle assembleDebug --no-daemon

    - name: Upload Finished APK Binary
      uses: actions/upload-artifact@v4
      with:
        name: smaran-sih-apk
        path: app/build/outputs/apk/debug/app-debug.apk
